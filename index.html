<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clash City BR - Liga de Guerra (CWL)</title>

    <meta name="description" content="Convocação da Liga de Guerra (CWL) da Família Clash City BR — confira a escalação tática dos três clãs e apresente-se ao seu clã designado.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://clashcitybr.github.io/liga/">
    <meta property="og:title" content="Clash City BR - Liga de Guerra (CWL)">
    <meta property="og:description" content="Convocação da Liga de Guerra (CWL) da Família Clash City BR — confira a escalação tática dos três clãs.">
    <meta property="og:image" content="https://clashcitybr.github.io/estilos/Imagens/Clashcity.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Clash City BR - Liga de Guerra (CWL)">
    <meta name="twitter:description" content="Convocação da Liga de Guerra (CWL) da Família Clash City BR — confira a escalação tática dos três clãs.">
    <meta name="twitter:image" content="https://clashcitybr.github.io/estilos/Imagens/Clashcity.png">

    <link rel="shortcut icon" href="imagens/Perfil_COC-removebg-preview.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #f9d246;
            --secondary: #077187;
            --dark: #11032c;
            --light: #ffffff;
            --accent: #6aa5ed;
            --bg-body: #f0f2f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: var(--bg-body);
            color: var(--dark);
        }

        /* --- MENU SUPERIOR --- */
        nav {
            background-color: var(--dark);
            padding: 20px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 4px;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        nav a:hover { color: var(--primary); }

        nav a.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 60vh;
            background: linear-gradient(rgba(17,3,44,0.55), rgba(7,113,135,0.45)),
                        url('imagens/desktop-wallpaper-clash-royale-all-superior-clash-royale-background-princess-clash-royale.jpg') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        /* --- SEÇÃO DA LISTA --- */
        .convocacao-section {
            padding: 60px 5%;
            text-align: center;
        }

        .convocacao-section h2 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 40px;
            color: var(--dark);
        }

        .tabs {
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .tab-btn {
            background-color: var(--dark);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-weight: 700;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary) 0%, #f3b13a 100%);
            color: var(--dark);
            box-shadow: 0 4px 15px rgba(249, 210, 70, 0.3);
        }

        .lista-nomes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .nome-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-weight: 700;
            text-align: left;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .nome-card:hover {
            transform: scale(1.02);
            border-left: 5px solid var(--primary);
        }

        .num {
            color: var(--primary);
            background: var(--dark);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-right: 15px;
            font-size: 0.8rem;
            font-weight: 900;
        }

        /* --- MENSAGEM E LINKS --- */
        .info-pos-lista {
            margin-top: 50px;
            padding: 40px 20px;
            background: #fff;
            border-radius: 15px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 2px dashed var(--primary);
        }

        .msg-alerta {
            font-weight: 900;
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: #b71c1c;
            text-transform: uppercase;
        }

        .link-cla {
            display: inline-block;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--dark) 100%);
            color: var(--primary);
            padding: 18px 45px;
            text-decoration: none;
            font-weight: 900;
            border-radius: 50px;
            text-transform: uppercase;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .link-cla:hover {
            transform: translateY(-3px);
            background: var(--primary);
            color: var(--dark);
            box-shadow: 0 8px 20px rgba(249, 210, 70, 0.4);
        }

        footer {
            background-color: var(--dark);
            color: #fff;
            padding: 40px;
            text-align: center;
            font-size: 0.8rem;
            margin-top: 80px;
        }

        @media (max-width: 768px) {
            .tabs { flex-direction: column; }
            .link-cla { width: 100%; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav>
        <ul>
            <li><a href="https://clashcitybr.github.io/">Home</a></li>
            <li><a href="https://clashcitybr.github.io/liga/" class="active">Liga</a></li>
            <li><a href="https://clashcitybr.github.io/controle-cla/">Desempenho</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Convocação CWL</h1>
        <p>Abaixo, confira a escalação tática da nossa elite para as batalhas.</p>
    </header>

    <main class="convocacao-section">
        <h2>Nossas Listas</h2>

        <div class="tabs">
            <button class="tab-btn" onclick="mostrarLista(event, 'principal')">CLASH CITY BR</button>
            <button class="tab-btn active" onclick="mostrarLista(event, 'clã2')">CLASH CITY BR 2</button>
            <button class="tab-btn" onclick="mostrarLista(event, 'clã3')">CLASH CITY BR 3</button>
        </div>

        <div id="containerListas" class="lista-nomes"></div>

        <div class="info-pos-lista">
            <p class="msg-alerta">Atenção Guerreiro!</p>
            <p style="margin-bottom: 20px; font-weight: 600;">Se o seu nome está na lista acima, apresente-se imediatamente ao seu clã designado.</p>
            <div id="containerLink"></div>
        </div>
    </main>

    <footer>
        <p>Família Clash City BR © desde 2017.</p>
    </footer>

    <script>
        const dadosListas = {
            'principal': {
                nomeExibicao: "CLASH CITY BR",
                membros: ["OFF"],
                link: "https://link.clashofclans.com/pt/?action=OpenClanProfile&tag=GUPJU0L2"
            },
             'clã2': {
                nomeExibicao: "CLASH CITY BR 2",
                membros: ["OFF"],
                link: "https://link.clashofclans.com/pt/?action=OpenClanProfile&tag=2LQY9RYV0"
            },
            'clã3': {
                nomeExibicao: "CLASH CITY BR 3",
                membros: ["Dking Bacon", "Shuya Goenji", "Kyros", "xFrozen", "Zaga-0", "Zaga-4", "Nettim", "Victor Hugo", "Rayleigh", "ManoplaDeBronze", "VitinDoGrau", "Igor", "Chicken Lord", "Seto Kaiba", "Zed the Dog"],
                link: "https://link.clashofclans.com/pt?action=OpenClanProfile&tag=2JY8QGQC8"
            }
        };

        function mostrarLista(e, idCla) {
            // Atualiza botões
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            if(e) e.target.classList.add('active');

            const container = document.getElementById('containerListas');
            const linkContainer = document.getElementById('containerLink');
            const dados = dadosListas[idCla];

            // Renderiza lista
            container.innerHTML = dados.membros.map((nome, index) => `
                <div class="nome-card">
                    <span class="num">${index + 1}</span>
                    <span class="nome">${nome}</span>
                </div>
            `).join('');

            // Renderiza o botão de entrada com o nome correto
            linkContainer.innerHTML = `
                <a href="${dados.link}" target="_blank" class="link-cla">Entrar no ${dados.nomeExibicao} agora</a>
            `;
        }

        // Início padrão
        mostrarLista(null, 'principal');
    </script>
</body>
</html>
